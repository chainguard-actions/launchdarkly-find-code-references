name: Test empty dockerImage causes error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          accessToken: "fake-ld-token"
          projKey: "test-project"
          # Explicitly set dockerImage to empty string to trigger the validation error
          dockerImage: ""
      - name: Assert action failed due to empty dockerImage
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when dockerImage is empty"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with empty dockerImage"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
