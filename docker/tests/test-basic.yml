name: Test basic usage with ignoreServiceErrors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          accessToken: "fake-ld-token"
          projKey: "test-project"
          repoName: "test-repo"
          ignoreServiceErrors: "true"
          debug: "false"
          contextLines: "2"
          lookback: "0"
      - name: Assert action ran (ignoreServiceErrors allows exit 0 on API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully (ignoreServiceErrors=true)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real LD token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
