name: Test empty docker image validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify docker is available on runner
        run: |
          if ! command -v docker > /dev/null 2>&1; then
            echo "SKIP: docker not available on this runner"
            exit 0
          fi
          echo "docker is available: $(docker --version)"
      - id: action
        uses: .
        continue-on-error: true
        with:
          accessToken: "fake-token-for-testing"
          dockerImage: ""
      - name: Assert action failed due to empty dockerImage
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when dockerImage is empty"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with empty dockerImage but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
