name: Test docker failure propagates
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install failing fake docker CLI
        run: |
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/docker <<'EOF'
          #!/bin/bash
          touch /tmp/docker-called
          echo "simulated scanner failure" >&2
          exit 3
          EOF
          chmod +x /tmp/fakebin/docker
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          accessToken: test-access-token
          projKey: my-project
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ ! -f /tmp/docker-called ]; then
            echo "FAIL: docker was never invoked"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          echo "PASS"
