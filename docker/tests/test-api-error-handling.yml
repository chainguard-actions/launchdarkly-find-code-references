name: Test API error handling without ignoreServiceErrors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          accessToken: "fake-token-for-testing"
          projKey: "test-project"
          repoName: "test-repo"
          ignoreServiceErrors: "false"
          lookback: "0"
          contextLines: "0"

      - name: Assert action fails when API is unreachable and ignoreServiceErrors is false
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a fake token and ignoreServiceErrors=false, the action should fail
          # because the LaunchDarkly API will reject the fake token
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (fake token rejected by LaunchDarkly API)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable if scanner found no flags)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
