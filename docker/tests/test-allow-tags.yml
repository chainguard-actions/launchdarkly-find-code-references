name: Test allowTags input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          accessToken: "fake-ld-token"
          projKey: "test-project"
          allowTags: "true"
          ignoreServiceErrors: "true"
          lookback: "0"
          contextLines: "0"
      - name: Assert action ran with allowTags enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with allowTags=true and ignoreServiceErrors=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real LD token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
