name: Test subdirectory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create subdirectory with sample code
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          echo '// feature flag reference: my-flag' > "$GITHUB_WORKSPACE/src/app.js"

      - id: action
        uses: .
        continue-on-error: true
        with:
          accessToken: "fake-token-for-subdirectory-test"
          projKey: "test-project"
          repoName: "test-repo"
          subdirectory: "src"
          ignoreServiceErrors: "true"
          lookback: "0"

      - name: Assert action ran with subdirectory input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with subdirectory input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake token / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
