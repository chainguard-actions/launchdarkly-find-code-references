name: Test custom docker image input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pull a lightweight test image
        run: docker pull alpine:3.19
      - id: action
        uses: .
        continue-on-error: true
        with:
          accessToken: "fake-ld-token"
          projKey: "test-project"
          # Use a simple alpine image that exits 0 immediately to verify
          # the dockerImage override mechanism works without needing LD credentials
          dockerImage: "alpine:3.19"
      - name: Assert action ran with custom image
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # alpine:3.19 with no command exits 0, so the action should succeed
          # (the docker run itself succeeds even though LD scanning doesn't happen)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully with custom docker image"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (custom image may not have LD scanner)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
