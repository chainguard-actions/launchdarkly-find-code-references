name: Test custom docker image
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          accessToken: "fake-token-for-testing"
          projKey: "test-project"
          repoName: "test-repo"
          dockerImage: "alpine:latest"
          ignoreServiceErrors: "true"
          lookback: "0"
          contextLines: "0"
      - name: Assert action ran with custom image
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # alpine:latest exits 0 by default (no LD scanner entrypoint),
          # so the docker run itself should succeed even though no scanning happens.
          # Either success or failure is acceptable — what matters is the action
          # correctly invoked docker with the custom image (not a precondition error).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom dockerImage input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
