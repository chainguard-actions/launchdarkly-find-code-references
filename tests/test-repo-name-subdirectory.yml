name: Test repoName and subdirectory inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          accessToken: fake-token-for-testing
          projKey: my-test-project
          repoName: my-custom-repo
          subdirectory: "."
          ignoreServiceErrors: "true"
          debug: "false"
      - name: Assert action completed with repoName and subdirectory
        run: |
          echo "Action completed successfully with repoName and subdirectory inputs"
          echo "PASS"
