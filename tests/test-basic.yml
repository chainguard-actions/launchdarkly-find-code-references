name: Test basic usage with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          accessToken: fake-token-for-testing
          projKey: my-test-project
          repoName: test-repo
          ignoreServiceErrors: "true"
          debug: "false"
          contextLines: "2"
          lookback: "10"
