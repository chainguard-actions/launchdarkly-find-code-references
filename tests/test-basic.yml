name: Test basic usage with accessToken and projKey
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          accessToken: fake-token-for-testing
          projKey: my-test-project
          ignoreServiceErrors: "true"
          debug: "false"
          contextLines: "2"
          lookback: "10"
      - name: Assert action completed
        run: |
          echo "Action completed successfully with ignoreServiceErrors=true"
          echo "PASS"
