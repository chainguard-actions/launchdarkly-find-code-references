name: Test missing projKey fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          accessToken: api-00000000-0000-0000-0000-000000000000
          repoName: test-repo
          baseUri: http://127.0.0.1:1
          lookback: "0"
      - name: Assert action failed without projKey
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when projKey is missing"
            exit 1
          fi
          echo "PASS"
