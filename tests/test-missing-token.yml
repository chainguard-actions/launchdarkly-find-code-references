name: Test missing required accessToken fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          accessToken: ""
          projKey: test-project
          ignoreServiceErrors: "true"
          lookback: "0"

      - name: Assert action fails when accessToken is empty
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # An empty/missing access token should cause the action to fail
          # (the LD API will reject it or the tool will detect it's missing)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with empty accessToken"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 (ignoreServiceErrors may have suppressed the error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
