name: Test custom context lines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-org/test-repo
      GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
      GITHUB_TOKEN: fake-github-token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run LaunchDarkly code references with 2 context lines
        id: action
        uses: .
        continue-on-error: true
        with:
          accessToken: fake-token-for-testing
          projKey: test-project
          contextLines: "2"
          lookback: "0"
          ignoreServiceErrors: "true"
      - name: Assert action completed with context lines
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          echo "Action completed successfully with contextLines=2 (ignoreServiceErrors=true)"
          echo "PASS"
