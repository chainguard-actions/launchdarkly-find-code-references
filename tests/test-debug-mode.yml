name: Test debug mode with ignoreServiceErrors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config and local origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a bare repo under GITHUB_WORKSPACE so it's accessible inside the Docker container
          # Inside the container, GITHUB_WORKSPACE is mounted at /github/workspace
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags 2>/dev/null || true
          # Point origin at the container-internal path so git fetch works inside Docker
          git remote set-url origin "/github/workspace/.git-remote" 2>/dev/null || \
            git remote add origin "/github/workspace/.git-remote"
          git remote -v

      - name: Run LaunchDarkly code references in debug mode
        id: action
        uses: .
        continue-on-error: true
        with:
          accessToken: fake-token-for-testing
          projKey: test-project
          ignoreServiceErrors: "true"
          lookback: "0"
          contextLines: "2"
          debug: "true"

      - name: Assert action ran in debug mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should run (success or failure) — we verify the Docker image
          # is valid and the binary executes with debug=true.
          # With a fake token, the binary may fail when fetching flags from LaunchDarkly.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome=$OUTCOME (expected success or failure)"
            exit 1
          fi
