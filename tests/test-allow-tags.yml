name: Test allowTags with tag push
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-org/test-repo
      GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
      GITHUB_TOKEN: fake-github-token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run LaunchDarkly code references with allowTags enabled
        id: action
        uses: .
        continue-on-error: true
        with:
          accessToken: fake-token-for-testing
          projKey: test-project
          allowTags: "true"
          ignoreServiceErrors: "true"
          contextLines: "0"
          lookback: "0"
      - name: Assert action completed for tag push with allowTags=true
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          echo "Action completed for tag push with allowTags=true (ignoreServiceErrors=true)"
          echo "PASS"
