name: Test ignoreServiceErrors with unreachable API
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        continue-on-error: true
        with:
          accessToken: api-00000000-0000-0000-0000-000000000000
          projKey: default
          repoName: test-repo
          baseUri: http://127.0.0.1:1
          lookback: "0"
          contextLines: "0"
          debug: "true"
          ignoreServiceErrors: "true"
      - name: Assert action ran and handled the unreachable API
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The scanner logs "Ignoring error and exiting" for the unreachable
          # API; depending on the scanner build the container exit code may be
          # 0 or 1. Either is a completed run; anything else (skipped/cancelled)
          # means the action never executed.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited 0 with ignoreServiceErrors=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and terminated after the service error"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
